# Dongle is USB-powered, so never let it sleep.
CONFIG_ZMK_SLEEP=n

# Prospector display
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y

# Radii status screen: colour grid layout, and the only one of the four that
# takes its palette from devicetree. Theme is chosen in corne_dongle.overlay.
CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y

# Modifier glyphs. The module defaults to Mac, which puts Cmd/Opt symbols on
# a Linux machine. Generic gives CTRL / ALT / GUI / SHFT.
CONFIG_PROSPECTOR_MODIFIER_OS_GENERIC=y

# ATT TX buffers for concurrent GATT discovery of the two peripherals.
# ZMK defaults this to 10 for any central (zmk#3216, which fixed #3156 --
# a dongle connecting two peripherals where one ends up connected but never
# delivers key presses). That 10 is a flat value, not scaled by peripheral
# count, and this dongle is also driving a display. Give discovery more room.
CONFIG_BT_ATT_TX_COUNT=20
