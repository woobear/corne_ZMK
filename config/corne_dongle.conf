# Dongle is USB-powered, so never let it sleep.
CONFIG_ZMK_SLEEP=n

# Prospector display
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y

# Classic status screen: layer roller with the neighbouring layers dimmed
# above and below. Note this layout hardcodes its palette -- the theme chosen
# in corne_dongle.overlay only applies to Radii.
CONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y

# Modifier glyphs. The module defaults to Mac, which puts Cmd/Opt symbols on
# a Linux machine. Generic gives CTRL / ALT / GUI / SHFT.
CONFIG_PROSPECTOR_MODIFIER_OS_GENERIC=y

# Raise BLE transmit power on the dongle only. This was added while chasing
# the silent right half, but the failure persisted with it enabled (59a7314)
# and was fixed later by 72d9225 -- so it was never load-bearing. Kept here
# because the dongle runs on USB, so a stronger downlink is free; the halves
# are back to default TX power to save battery.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ATT TX buffers for concurrent GATT discovery of the two peripherals.
# ZMK defaults this to 10 for any central (zmk#3216, which fixed #3156 --
# a dongle connecting two peripherals where one ends up connected but never
# delivers key presses). That 10 is a flat value, not scaled by peripheral
# count, and this dongle is also driving a display. Give discovery more room.
CONFIG_BT_ATT_TX_COUNT=20
