manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: carrefinho
      url-base: https://github.com/carrefinho
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: prospector-zmk-module
      remote: carrefinho
      # `main` targets ZMK v0.3 / Zephyr 3.5; this branch is the one that
      # builds against ZMK main (Zephyr 4.1).
      revision: feat/new-status-screens
  self:
    path: config
