# Applies to every corne part -- corne_left, corne_right and corne_dongle all
# resolve "corne.conf" as a config candidate.

# Raise BLE transmit power. The connection troubleshooting docs recommend this
# whenever you are hitting connection issues, and note it also strengthens the
# link between split parts. Power cost is negligible on the nRF52840.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
