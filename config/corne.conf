# Applies to every corne part -- corne_left, corne_right and corne_dongle all
# resolve "corne.conf" as a config candidate.

# ZMK's bundle of connection-stability settings, planned to become the
# default. Currently it disables 2M PHY, which the connection troubleshooting
# docs call out as a fix for links that pair but then misbehave.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Raise BLE transmit power. Recommended by the same docs for connection
# trouble, and it strengthens the link between split parts. Negligible power
# cost on the nRF52840.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
